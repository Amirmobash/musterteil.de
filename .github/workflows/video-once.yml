# One-time build for royalty-free local footage. Delete after the job succeeds.
name: One-time local background video preparation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/video-once.yml'
permissions:
  contents: write
jobs:
  render-local-video:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check tools and download licensed real camera footage
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y ffmpeg; }
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 230 \
            'https://videos.pexels.com/video-files/31076271/13279771_3840_2160_25fps.mp4' \
            --output /tmp/real-print.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 /tmp/real-print.mp4
      - name: Encode lightweight cinematic local loop and poster
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y -nostdin -ss 0 -t 8 -i /tmp/real-print.mp4 \
            -vf 'fps=24,scale=1280:-2:flags=lanczos,eq=brightness=0.025:contrast=1.06:saturation=1.18' \
            -an -c:v libx264 -preset medium -crf 27 -pix_fmt yuv420p \
            -movflags +faststart assets/video/bg-lab.mp4
          ffmpeg -y -nostdin -ss 2 -i assets/video/bg-lab.mp4 \
            -frames:v 1 -c:v libwebp -quality 82 assets/video/bg-lab.webp
          test -s assets/video/bg-lab.mp4
          test -s assets/video/bg-lab.webp
          stat -c '%n %s bytes' assets/video/bg-lab.mp4 assets/video/bg-lab.webp
      - name: Document license correctly
        shell: bash
        run: |
          cat > assets/video/LICENSE.md <<'EOF'
          # Musterteil LAB background footage

          Local optimized video: `bg-lab.mp4`; derived poster: `bg-lab.webp`.

          **Real camera footage**, filmed by Jakub Zerdzicki and originally
          published on Pexels:
          https://www.pexels.com/video/precision-orange-3d-printer-in-workshop-setting-31076271/

          Licensed for website use and adaptation under the **Pexels License**:
          https://www.pexels.com/license/

          This stock footage is **not CC0** and is not an original render by
          the Musterteil project. Creator credit is provided voluntarily.
          The footage is not used as part of a trademark, nor does its
          inclusion imply that a brand or producer endorses this website.

          Media was locally re-encoded as H.264 MP4 for privacy and speed.
          Visitors load the video from the same GitHub Pages domain, not
          from Pexels. This README preserves attribution and origin.
          EOF
      - name: Commit local video directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/video/bg-lab.mp4 assets/video/bg-lab.webp assets/video/LICENSE.md
          git commit -m 'assets: use licensed real 3D printer footage in local background'
          git push origin HEAD:main
