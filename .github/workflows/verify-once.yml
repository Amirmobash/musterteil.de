# One-time verification, removed after completion. Public standard runner has no usage charge.
name: One-time Musterteil quality verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-once.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install free local test dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run syntax checks and node unit tests
        run: |
          node --check assets/core.mjs
          node --check assets/app.mjs
          node --check assets/viewer.mjs
          npm test
          python3 -m json.tool prices.json >/dev/null
      - name: Start local server and exercise full browser flows
        run: |
          set -e
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/musterteil-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          npm run test:browser
