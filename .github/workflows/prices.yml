name: Update official Bambu Lab reference
on:
  schedule:
    - cron: "13 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/update_prices.py
      - name: Commit verified reference only
        run: |
          if ! git diff --quiet -- prices.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add prices.json
            git commit -m "data: refresh dated official Bambu prices"
            git push
          fi
